<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đang xem - PMovie</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="watch-page">

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <span class="logo-p">P</span>Movie
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Trang chủ</a>
        <a href="index.html?type=Phim+lẻ" class="nav-link">Phim lẻ</a>
        <a href="index.html?type=Phim+bộ" class="nav-link">Phim bộ</a>
      </nav>
      <a href="index.html" class="btn btn-secondary btn-sm">← Quay lại</a>
    </div>
  </header>

  <!-- BREADCRUMB -->
  <div class="breadcrumb-bar">
    <div class="container">
      <span class="breadcrumb-link" onclick="history.back()">← Quay lại</span>
      <span class="breadcrumb-sep">/</span>
      <span class="breadcrumb-current" id="breadcrumbTitle"></span>
    </div>
  </div>

  <!-- WATCH LAYOUT -->
  <main class="watch-layout">
    <div class="container">
      <div class="watch-grid">

        <!-- LEFT: PLAYER + INFO -->
        <div class="watch-main">
          <!-- Player -->
          <div class="player-wrapper">
            <div class="player-loading" id="playerLoading">
              <div class="spinner"></div>
              <p>Đang tải video...</p>
            </div>
            <video
              id="videoPlayer"
              controls
              controlslist="nodownload"
              preload="metadata"
              playsinline
            ></video>            <!-- Nút fullscreen landscape, chỉ hiện trên thiết bị cảm ứng -->
            <button class="fs-btn" id="fsBtn" onclick="requestFullscreenLandscape()" title="Toàn màn hình ngang">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="15,3 21,3 21,9"/>
                <polyline points="9,21 3,21 3,15"/>
                <line x1="21" y1="3" x2="14" y2="10"/>
                <line x1="3" y1="21" x2="10" y2="14"/>
              </svg>
            </button>          </div>

          <!-- Now Playing -->
          <div class="now-playing-bar">
            <div class="now-playing-info">
              <span class="now-playing-label">Đang phát:</span>
              <span class="now-playing-ep" id="nowPlayingEp"></span>
            </div>
            <div class="ep-nav">
              <button class="ep-nav-btn" id="prevEpBtn" onclick="navigateEpisode(-1)" title="Tập trước">
                <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="19,20 9,12 19,4"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"/></svg>
              </button>
              <button class="ep-nav-btn" id="nextEpBtn" onclick="navigateEpisode(1)" title="Tập sau">
                <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,4 15,12 5,20"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/></svg>
              </button>
            </div>
          </div>

          <!-- Movie Info -->
          <div class="watch-info">
            <div class="watch-info-header">
              <div>
                <div class="watch-title-row">
                  <h1 class="watch-title" id="watchTitle"></h1>
                  <span class="badge-type" id="watchType"></span>
                </div>
                <div class="watch-meta" id="watchMeta"></div>
              </div>
            </div>
            <p class="watch-description" id="watchDescription"></p>
          </div>
        </div>

        <!-- RIGHT: EPISODE LIST -->
        <aside class="watch-sidebar">
          <div class="sidebar-header">
            <h3 class="sidebar-title">Danh sách tập</h3>
            <span class="ep-count" id="epCount"></span>
          </div>
          <div class="episode-list" id="episodeList">
            <!-- JS render -->
          </div>
        </aside>

      </div>
    </div>
  </main>

  <!-- RELATED MOVIES -->
  <section class="related-section">
    <div class="container">
      <h2 class="section-title">Phim liên quan</h2>
      <div class="movie-grid" id="relatedGrid">
        <!-- JS render -->
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <p class="footer-logo"><span class="logo-p">P</span>Movie</p>
      <p class="footer-text">© 2024 PMovie. Trang web xem phim trực tuyến.</p>
    </div>
  </footer>

  <script src="js/watch.js"></script>
</body>
</html>
