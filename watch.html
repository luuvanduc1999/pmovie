<!DOCTYPE html>
<html lang="vi" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đang xem - DMovie</title>
  <link rel="icon" type="image/png" href="static/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=70" />
</head>

<body class="watch-page">

  <!-- TOP NAVBAR (Stitch Watch Exact) -->
  <header class="navbar" id="topNavbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <span>DMovie</span>
      </a>

      <!-- Back Action -->
      <a href="index.html" class="watch-navbar-back">
        <span class="material-symbols-outlined">arrow_back</span>
        <span>Quay lại</span>
      </a>
    </div>
  </header>

  <!-- WATCH LAYOUT CANVAS -->
  <main class="watch-layout">

    <!-- Video Player Section (16:9 Aspect Ratio) -->
    <section class="video-section">
      <div class="player-wrapper" id="playerWrapper" tabindex="0">
        <video id="videoPlayer" playsinline webkit-playsinline preload="metadata"></video>

        <!-- Loading Spinner -->
        <div class="player-loading hidden" id="playerLoading">
          <div class="spinner"></div>
          <p>Đang tải video...</p>
        </div>

        <!-- Double-Tap / Quick Seek Ripple -->
        <div class="seek-ripple left" id="seekRippleLeft">
          <div class="ripple-icon-box">
            <span class="material-symbols-outlined">replay_5</span>
            <span>-5s</span>
          </div>
        </div>
        <div class="seek-ripple right" id="seekRippleRight">
          <div class="ripple-icon-box">
            <span class="material-symbols-outlined">forward_5</span>
            <span>+5s</span>
          </div>
        </div>

        <!-- Center Screen Play/Pause & Quick Seek -->
        <div class="player-center-controls" id="playerCenterControls">
          <button class="center-seek-btn" id="centerRewindBtn" title="Lùi 5 giây (←)">
            <span class="material-symbols-outlined">replay_5</span>
            <span class="center-seek-label">-5s</span>
          </button>

          <button class="center-play-btn" id="centerPlayPauseBtn" title="Phát / Tạm dừng (Space)">
            <span class="material-symbols-outlined fill icon-play">play_arrow</span>
            <span class="material-symbols-outlined fill icon-pause" style="display:none;">pause</span>
          </button>

          <button class="center-seek-btn" id="centerForwardBtn" title="Tua 5 giây (→)">
            <span class="material-symbols-outlined">forward_5</span>
            <span class="center-seek-label">+5s</span>
          </button>
        </div>

        <!-- Bottom Controls Overlay (Stitch 2px Progress Bar) -->
        <div class="player-bottom-controls" id="playerBottomControls">

          <!-- Timeline Scrubber -->
          <div class="timeline-container" id="timelineContainer">
            <div class="timeline-track" id="timelineTrack">
              <div class="timeline-buffered" id="timelineBuffered"></div>
              <div class="timeline-hover-preview" id="timelineHoverPreview"></div>
              <div class="timeline-played" id="timelinePlayed">
                <div class="timeline-handle" id="timelineHandle"></div>
              </div>
            </div>
            <div class="timeline-tooltip" id="timelineTooltip">00:00</div>
          </div>

          <!-- Controls Bar -->
          <div class="player-controls-bar">
            <div class="controls-left">
              <!-- Play/Pause -->
              <button class="ctrl-btn" id="ctrlPlayPauseBtn" title="Phát / Dừng (Space)">
                <span class="material-symbols-outlined fill icon-play">play_arrow</span>
                <span class="material-symbols-outlined fill icon-pause" style="display:none;">pause</span>
              </button>

              <!-- Rewind 5s -->
              <button class="ctrl-btn" id="ctrlRewindBtn" title="Lùi 5s (←)">
                <span class="material-symbols-outlined">replay_5</span>
              </button>

              <!-- Forward 5s -->
              <button class="ctrl-btn" id="ctrlForwardBtn" title="Tua 5s (→)">
                <span class="material-symbols-outlined">forward_5</span>
              </button>

              <!-- Volume & Slider -->
              <div class="volume-group">
                <button class="ctrl-btn" id="ctrlVolumeBtn" title="Bật/Tắt âm thanh (M)">
                  <span class="material-symbols-outlined icon-vol-high">volume_up</span>
                  <span class="material-symbols-outlined icon-vol-mute" style="display:none;">volume_off</span>
                </button>
                <div class="volume-slider-wrap">
                  <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1" />
                </div>
              </div>

              <!-- Time Display -->
              <div class="time-display" id="timeDisplay">
                <span id="currentTimeText">00:00</span>
                <span style="opacity:0.4; margin: 0 4px;">/</span>
                <span id="durationText">00:00</span>
              </div>
            </div>

            <div class="controls-right">
              <!-- Speed Menu -->
              <div class="speed-menu-wrap">
                <button class="ctrl-btn font-label-sm" id="ctrlSpeedBtn" title="Tốc độ phát"
                  style="font-weight:700;">1x</button>
                <div class="speed-dropdown" id="speedDropdown">
                  <div class="speed-option" data-speed="0.5">0.5x</div>
                  <div class="speed-option" data-speed="0.75">0.75x</div>
                  <div class="speed-option active" data-speed="1">1x (Chuẩn)</div>
                  <div class="speed-option" data-speed="1.25">1.25x</div>
                  <div class="speed-option" data-speed="1.5">1.5x</div>
                  <div class="speed-option" data-speed="2">2x</div>
                </div>
              </div>

              <!-- PiP -->
              <button class="ctrl-btn" id="ctrlPipBtn" title="Hình trong hình (PiP)">
                <span class="material-symbols-outlined">picture_in_picture_alt</span>
              </button>

              <!-- Fullscreen -->
              <button class="ctrl-btn" id="ctrlFullscreenBtn" title="Toàn màn hình (F)">
                <span class="material-symbols-outlined icon-fs-enter">fullscreen</span>
                <span class="material-symbols-outlined icon-fs-exit" style="display:none;">fullscreen_exit</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Watch Details Container (Stitch 2-Column Exact) -->
    <div class="watch-content-container">
      
      <div class="watch-main-row">
        <!-- Left Column: Movie Info -->
        <div class="watch-info-col">
          <h1 class="watch-title" id="watchTitle"></h1>
          <div class="watch-meta-row" id="watchMeta"></div>
          <p class="watch-description" id="watchDescription"></p>
        </div>

        <!-- Right Column: Episode Selection -->
        <div class="watch-episodes-col" id="episodesCol">
          <div class="episodes-control-row">
            <h3 class="now-playing-title" id="nowPlayingEp">Đang phát: Tập 1</h3>
            <div class="ep-nav-actions">
              <button class="ep-nav-btn" id="prevEpBtn" onclick="navigateEpisode(-1)" title="Tập trước">
                <span class="material-symbols-outlined">skip_previous</span>
              </button>
              <button class="ep-nav-btn" id="nextEpBtn" onclick="navigateEpisode(1)" title="Tập sau">
                <span class="material-symbols-outlined">skip_next</span>
              </button>
            </div>
          </div>
          <div class="episode-btns-list" id="episodeList">
            <!-- Dynamic circular buttons: 1, 2, 3, 4... -->
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">DMovie</div>
      <div class="footer-copy">© 2024 DMovie. Nền tảng xem phim trực tuyến của một con vịt</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <script src="js/watch.js?v=47"></script>
</body>

</html>
