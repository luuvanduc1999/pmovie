<!DOCTYPE html>
<html lang="vi" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DMovie - Xem Phim Online Miễn Phí</title>
  <meta name="description"
    content="DMovie - Trang web xem phim trực tuyến chất lượng cao, chuẩn rạp với phong cách Cinematic tối giản." />
  <link rel="icon" type="image/png" href="static/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=60" />
</head>

<body>

  <!-- TOP NAVBAR (Stitch Exact) -->
  <header class="navbar" id="topNavbar">
    <div class="navbar-inner">
      <!-- Brand Logo -->
      <a href="index.html" class="logo">
        <span>DMovie</span>
      </a>

      <!-- Trailing Action Icons -->
      <div class="nav-actions">
        <button class="nav-icon-btn" id="searchToggle" title="Tìm kiếm (Ctrl+K hoặc /)" aria-label="Tìm kiếm">
          <span class="material-symbols-outlined">search</span>
        </button>
      </div>
    </div>
  </header>

  <!-- SEARCH OVERLAY / MODAL -->
  <div class="search-overlay" id="searchOverlay" role="dialog" aria-modal="true">
    <div class="search-modal">
      <div class="search-input-box">
        <span class="material-symbols-outlined">search</span>
        <input type="text" id="searchInput" placeholder="Tìm kiếm phim theo tên, thể loại..." autocomplete="off" />
        <span class="search-close-badge" id="searchClose">ESC</span>
      </div>
    </div>
  </div>

  <!-- HERO SECTION (Stitch Exact) -->
  <section class="hero" id="heroBanner">
    <div class="hero-bg-container">
      <div class="hero-bg-image" id="heroBg"></div>
      <div class="hero-gradient-x"></div>
      <div class="hero-gradient-y"></div>
    </div>

    <div class="hero-content">
      <h1 class="hero-title" id="heroTitle">Đang tải...</h1>

      <!-- Metadata -->
      <div class="hero-meta" id="heroMeta"></div>

      <!-- Description -->
      <p class="hero-desc" id="heroDesc"></p>

      <!-- Actions -->
      <div class="hero-actions">
        <a href="#" class="btn btn-primary" id="heroWatch">
          <span class="material-symbols-outlined fill">play_arrow</span>
          Xem Ngay
        </a>
      </div>
    </div>
  </section>

  <!-- CONTENT GRID SECTION (Stitch Exact 6-Column) -->
  <main class="main-content" style="padding-top: 48px;">
    <div id="sectionsContainer">
      <!-- Dynamic movie sections generated by JS (Phim lẻ, Phim bộ) -->
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState" style="display:none">
      <span class="material-symbols-outlined">search_off</span>
      <p>Không tìm thấy phim nào phù hợp</p>
    </div>
  </main>

  <!-- FOOTER (Stitch Exact) -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">DMovie</div>
      <div class="footer-copy">© 2024 DMovie. Nền tảng xem phim trực tuyến của một con vịt.</div>
    </div>
  </footer>

  <script src="js/app.js?v=40"></script>
</body>

</html>
